[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "asgp-sdk"
version = "0.1.0"
description = "Python integration SDK for ASGP"
requires-python = ">=3.11"
dependencies = [
    "cryptography>=44,<47",
    "httpx>=0.27,<1",
    "pydantic>=2.10,<3",
]

[project.optional-dependencies]
langchain = ["langchain>=1.0,<2", "langgraph>=1.0,<2"]
claude = ["claude-agent-sdk>=0.2,<1"]

[tool.setuptools.packages.find]
where = ["."]
include = ["asgp_sdk*"]
