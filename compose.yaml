services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: asgp
      POSTGRES_USER: asgp
      POSTGRES_PASSWORD: change-me
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U asgp -d asgp"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - asgp_postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    environment:
      ASGP_DATABASE_URL: postgresql+psycopg://asgp:change-me@postgres:5432/asgp
      ASGP_ALLOWED_ORIGINS: http://localhost:4173,http://127.0.0.1:4173
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "4173:4173"
    depends_on:
      - backend

  demo-agent:
    profiles: ["demo"]
    build:
      context: .
      dockerfile: Dockerfile.demo
    depends_on:
      - backend
    command: ["python", "-m", "demo.run_agent", "--base-url", "http://backend:8000"]

volumes:
  asgp_postgres_data:
