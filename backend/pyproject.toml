[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "asgp-backend"
version = "0.1.0"
description = "ASGP security gateway backend"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.14,<2",
    "cryptography>=44,<47",
    "fastapi>=0.115,<1",
    "psycopg[binary]>=3.2,<4",
    "pydantic>=2.10,<3",
    "sqlalchemy>=2.0,<3",
    "uvicorn[standard]>=0.34,<1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
