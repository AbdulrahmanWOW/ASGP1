[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "asgp-gateway"
version = "0.1.0"
description = "MCP gateway that routes every tool call through ASGP"
requires-python = ">=3.11"
dependencies = [
    "asgp-sdk",
    "mcp>=2.3,<3",
    "httpx>=0.27,<1",
    "pydantic>=2.10,<3",
]

[project.scripts]
asgp-gateway = "asgp_gateway.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["asgp_gateway*"]
